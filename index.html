<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .animate-gradient {
      background-size: 200% 200%;
      animation: gradient-shift 8s ease infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <h1 class="animate-gradient bg-gradient-to-r from-indigo-400 via-pink-400 to-amber-300 bg-clip-text text-transparent text-6xl md:text-8xl font-extrabold tracking-tight hover:scale-110 transition-transform duration-500 ease-out cursor-default select-none">
    Hello World
  </h1>
</body>
</html>
